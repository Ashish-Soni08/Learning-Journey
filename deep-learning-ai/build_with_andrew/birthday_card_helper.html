<!DOCTYPE html>
<html>
<head>
    <title>Birthday Card Helper</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #ffe082;
            min-height: 100vh;
        }
        .page-title {
            text-align: center;
            font-size: 2.7em;
            font-weight: bold;
            color: #ff7043;
            padding-top: 26px;
            letter-spacing: 2px;
            text-shadow: 1.5px 1.5px #ffc107, 3px 3px #fffde7;
        }
        .big-confetti {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .open-card-container {
            display: flex;
            background: #fffbe7;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            width: 770px;
            min-height: 380px;
            border: 3px solid #fff9c4;
            margin: 26px auto 24px auto;
            position: relative;
            max-width: 95vw;
        }
        .card-left, .card-right {
            width: 50%;
            min-height: 380px;
            padding: 32px 30px;
            box-sizing: border-box;
        }
        .fold-line {
            width: 3px;
            background: repeating-linear-gradient(
                to bottom, #ffe082 0, #ffe082 10px, #d7ccc8 10px, #d7ccc8 12px
            );
            height: 100%;
            position: absolute;
            left: 50%;
            top: 0;
        }
        .festive-title {
            font-size: 2.05em;
            font-weight: bold;
            color: #ff7043;
            text-align: center;
            text-shadow: 1px 1px #ffecb3, 2px 2px #ffc107;
            margin: 10px 0 13px 0;
        }
        .confetti {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 3px;
        }
        .card-left label {
            display: block;
            margin-top: 13px;
            color: #333;
        }
        .card-left input {
            margin-top: 6px;
            width: 100%;
            padding: 7px;
            border: 1px solid #ffd54f;
            border-radius: 5px;
        }
        .card-left button {
            margin-top: 17px;
            background: linear-gradient(90deg,#ff7043 70%,#ffd54f 110%);
            color: #fff;
            border: none;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s, color 0.2s;
            box-shadow: 1px 1px 8px #ffd54f33;
        }
        .card-left button:hover {
            background: #ffd54f;
            color: #ff5722;
        }
        .card-right {
            /* "Inside cover" style */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: repeating-linear-gradient(-45deg, #fffbe7 0, #fffbe7 22px, #fff9c4 23px, #fff9c4 34px);
            border-radius: 0 10px 10px 0;
            border-left: 2px solid #ffe082;
        }
        #message {
            min-height: 110px;
            max-width: 320px;
            background: #fffde7;
            border: 2px dashed #ffd54f;
            border-radius: 15px;
            box-shadow: 0 2px 14px #ffd54f66;
            margin-top: 12px;
            padding: 23px 17px;
            font-size: 1.14em;
            color: #5d4037;
            text-align: center;
            font-family: 'Comic Sans MS', Comic, Arial, cursive;
            white-space: pre-line;
        }
        /* Stacking old cards */
        #card-history-section {
            max-width: 800px;
            margin: 12px auto 45px auto;
        }
        .old-card {
            display: block;
            background: #fffbe7;
            max-width: 380px;
            margin: 18px auto;
            border-radius: 16px;
            box-shadow: 0 3px 18px #ffe08255;
            border: 2.2px solid #ffd54f;
            position: relative;
        }
        .old-card-decoration {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 1.25em;
        }
        .old-card-content {
            text-align: center;
            padding: 28px 15px 20px 15px;
            font-family: 'Comic Sans MS', Comic, Arial, cursive;
            font-size: 1.08em;
            color: #6d4c41;
            white-space: pre-line;
        }
        /* Responsive for smaller screens */
        @media (max-width: 770px) {
            .open-card-container {
                flex-direction: column;
                width: 97vw;
            }
            .fold-line {
                display: none;
            }
            .card-left, .card-right {
                width: 100%;
                min-height: 200px;
            }
            .card-right {
                border-radius: 0 0 10px 10px;
                border-left: none;
                border-top: 2px solid #ffe082;
            }
            #message, .old-card {
                max-width: 95vw;
            }
        }
    </style>
</head>
<body>
    <div class="page-title">
        <span class="big-confetti">🎊🎂🎈</span><br>
        The Funniest Birthday Card Helper!<br>
        <span class="big-confetti">🥳🎁✨</span>
    </div>
    <div class="open-card-container">
        <div class="card-left">
            <div class="confetti">🎉🎂✨</div>
            <div class="festive-title">Your Birthday Card Writer</div>
            <p style="text-align:center; margin-bottom:22px; color:#9e7400;">Personalise your funny birthday card!</p>
            
            <form id="cardForm" autocomplete="off">
                <label>
                    Name:<br>
                    <input type="text" id="name" required placeholder="Friend's name">
                </label>
                <label>
                    Age:<br>
                    <input type="number" id="age" required min="1" placeholder="Friend's age">
                </label>
                <label>
                    Hobby:<br>
                    <input type="text" id="hobby" required placeholder="Favourite hobby">
                </label>
                <button type="submit">Write My Birthday Message</button>
            </form>
        </div>
        <div class="fold-line"></div>
        <div class="card-right">
            <div id="message">
                <span style="font-size:1.3em; color:#ff7043; font-family:inherit;">🎈</span><br>
                Your funny message will appear here!
                <br><span style="font-size:1.2em; color:#ffd54f">🎉</span>
            </div>
        </div>
    </div>
    <div id="card-history-section">
        <!-- Old cards will appear here -->
    </div>
<script>
const form = document.getElementById('cardForm');
const messageDiv = document.getElementById('message');
const cardHistoryDiv = document.getElementById('card-history-section');

form.onsubmit = function(event) {
    event.preventDefault();
    const name = document.getElementById('name').value.trim();
    const age = document.getElementById('age').value.trim();
    const hobby = document.getElementById('hobby').value.trim();

    const messages = [
        `Happy Birthday, ${name}!

Wow, ${age} years young and still a master at ${hobby}?
You make aging look like a hobby itself! 🎂😂`,

        `Dear ${name}, another year older but your skills in ${hobby} are still as sharp as ever!
At ${age}, you’re living proof that fun (and cake) keeps you young. Enjoy your special day!`,

        `Hey ${name}! Turning ${age} just means more time for ${hobby}...
and more excuses to eat extra cake. Happy Birthday, legend! 🎉`,

        `To ${name},
At ${age}, you're now officially old enough to be a professional at ${hobby},
and young enough to get away with it! Have a fantastic birthday! 🥳`
    ];
    const msg = messages[Math.floor(Math.random() * messages.length)];

    // If the message area has a generated message (not placeholder), save it as an old card
    if (
        messageDiv.innerText.trim() !== "" &&
        !messageDiv.innerText.includes("Your funny message will appear here!")
    ) {
        const prevMsg = messageDiv.innerText;
        const oldCard = document.createElement('div');
        oldCard.className = 'old-card';
        oldCard.innerHTML = `
            <div class="old-card-decoration">🎊</div>
            <div class="old-card-content">${prevMsg}</div>
        `;
        // Add it at the top of history
        cardHistoryDiv.insertBefore(oldCard, cardHistoryDiv.firstChild);
    }

    // Show the new message
    messageDiv.innerText = msg;

    // Optionally, reset the form fields for the next entry:
    // form.reset();
};

// If you want to clear the history, you could add a little button in the future!
</script>
</body>
</html>
