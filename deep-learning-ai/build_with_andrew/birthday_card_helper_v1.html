<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Birthday Card Fun Factory</title>
    <!-- Google Fonts for fancier titles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 30%, #FFFFFF 70%, #138808 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            padding: 30px;
            min-height: 100vh;
        }
        .form-section {
            flex: 1;
            padding: 30px;
            background: #ffffffee;
            border-radius: 15px;
            margin-right: 20px;
            box-shadow: 0 2px 12px #ccc;
        }
        .card-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        h1 {
            font-family: 'Luckiest Guy', cursive, 'Comic Sans MS', sans-serif;
            text-align: center;
            color: #FF9933;
            font-size: 3em;
            margin-top: 24px;
            letter-spacing: 2.5px;
            text-shadow: 0 0 10px #FFF, 2px 2px 0 #138808, 0 2px 10px #02216244;
        }
        .subtitle {
            font-family: 'Pacifico', cursive, 'Comic Sans MS', sans-serif;
            text-align: center;
            font-size: 1.5em;
            color: #138808;
            margin-bottom: 18px;
            letter-spacing: 1.6px;
            text-shadow: 0 0 4px #FF9933, 1px 1px 0 #FFF;
        }
        .birthday-card {
            width: 340px;
            background: #fff;
            border: 3px solid #FF9933;
            border-radius: 18px;
            box-shadow: 0 8px 20px #13880844;
            margin-bottom: 20px;
            padding: 20px 18px 13px 18px;
            color: #022162;
            font-size: 1.15em;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: box-shadow .2s, border-color .2s;
        }
        .birthday-card:hover {
            box-shadow: 0 0 20px #13880899, 0 8px 20px #FF993344;
            border-color: #138808;
        }
        .card-title {
            font-family: 'Fredoka One', cursive, sans-serif;
            font-size: 1.35em;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 1.2px;
            color: #FF9933;
            text-shadow: 0 0 7px #fff, 1px 1px 0 #138808;
            margin-top: 5px;
        }
        .balloons {
            font-size: 2.1em;
            margin-bottom: 8px;
            margin-top: 0;
        }
        .inside-message {
            background: #e6ffe7;
            color: #022162;
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
            width: 95%;
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            box-shadow: 0 2px 8px #FF993344;
            font-size: 1.16em;
            margin-bottom: 13px;
        }
        label {
            font-size: 1.06em;
            margin-top: 12px;
            display: block;
            color: #138808;
            font-family: 'Fredoka One', cursive, sans-serif;
            letter-spacing: 0.5px;
            text-shadow: 0 0 2px #FF9933;
        }
        input[type="text"], input[type="number"] {
            font-size: 1.13em;
            padding: 7px;
            margin: 7px 0 14px 0;
            width: 85%;
            border-radius: 7px;
            border: 2px solid #FF9933;
            font-family: inherit;
            background: #fff;
            color: #022162;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border: 2.5px solid #138808;
            outline: none;
        }
        button {
            font-size: 1.11em;
            background: #138808;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 7px;
            margin-top: 8px;
            cursor: pointer;
            margin-bottom: 3px;
            transition: background 0.2s, color 0.14s;
            font-family: 'Fredoka One', cursive, sans-serif;
            box-shadow: 0 2px 8px #02216222;
            letter-spacing: 0.5px;
        }
        button:hover {
            background: #FF9933;
            color: #fff;
        }
        .lucky-btn {
            background: #FF9933;
            margin-left: 8px;
            margin-bottom: 0;
            color: #022162;
            text-shadow: 0 0 1.5px #fff, 1px 1px 0 #FFFFFF80;
        }
        .lucky-btn:hover {
            background: #138808;
            color: #fff;
        }
        .copy-btn {
            margin-top: 4px;
            background: #022162;
            color: #FF9933;
            font-size: 1.01em;
            padding: 7px 12px;
            border-radius: 7px;
            min-width: 95px;
            letter-spacing: 0.8px;
            text-shadow: 0 0 2px #fff;
            border: none;
            cursor: pointer;
            transition: background 0.18s, color 0.14s;
        }
        .copy-btn:hover, .copy-btn.copied {
            background: #2ecc40;
            color: #fff;
        }
        .copied {
            background: #2ecc40 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <h1>
        <span style="color:#022162; text-shadow:0 0 8px #FF9933;">🎉</span>
        Birthday Card <span style="color:#FF9933; text-shadow:0 0 8px #138808, 1px 1.5px 0 #fff;">Fun Factory</span>! 
        <span style="color:#138808; text-shadow:0 0 8px #FF9933;">🎂</span>
    </h1>
    <div class="container">
        <!-- Left: Form Section -->
        <div class="form-section">
            <div class="subtitle">Make an Indian-Flag Inspired Birthday Card!</div>
            <form id="cardForm" autocomplete="off">
                <label for="name">Name:</label>
                <input type="text" id="name" required/>
                
                <label for="age">Age:</label>
                <input type="number" id="age" min="1" required/>
                
                <label for="hobby">Hobby:</label>
                <input type="text" id="hobby" required/>
                
                <label for="adjective">Adjective:</label>
                <input type="text" id="adjective" required/>
                
                <label for="pluralNoun">Plural Noun:</label>
                <input type="text" id="pluralNoun" required/>
                
                <button type="submit">Make Card!</button>
                <button type="button" class="lucky-btn" id="luckyBtn">I'm feeling lucky!</button>
            </form>
        </div>

        <!-- Right: Card Section -->
        <div class="card-section" id="cardSection">
            <!-- Cards will appear here -->
        </div>
    </div>

    <script>
        // Random options for "I'm feeling lucky"
        const names = [
            "Captain Ladoo", "Dr. Sprinkles", "Ziggy", "Princess Mango",
            "Sir Laughs-a-lot", "Sunny", "Snickers", "Waffles", "Queen Jalebi",
            "King Pickles", "Agent Banana", "Duke Disco"
        ];
        const ages = [7, 10, 16, 21, 30, 40, 50, 70, 99, 65, 13, 27];
        const hobbies = [
            "yoga", "cricket", "Bollywood dancing", "kites flying", "spicy food tasting",
            "cloud watching", "karaoke", "bollywood movie marathons", "spaghetti slurping",
            "street food safaris", "drawing rangoli", "singing bhajans"
        ];
        const adjectives = [
            "colorful", "vibrant", "spicy", "festive", "unstoppable", "brilliant",
            "zesty", "dazzling", "hilarious", "cheerful", "energetic", "radiant"
        ];
        const pluralNouns = [
            "laddoos", "firecrackers", "kites", "jalebis", "dholaks", "samosas",
            "cupcakes", "marigolds", "giggles", "pigeons", "sweet memories", "balloons"
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Create a funny personalized birthday message using all inputs
        function funnyMessage(name, age, hobby, adjective, pluralNoun) {
            return `
                Hey ${name}, happy ${age}th birthday!<br><br>
                As someone who loves ${hobby}, you deserve the most ${adjective} year ever!<br>
                May your days be filled with endless ${pluralNoun}, laughter, and cake.<br><br>
                Remember: you're only as ${adjective} as the number of ${pluralNoun} you collect!
            `;
        }

        function plainTextCard(name, age, hobby, adjective, pluralNoun) {
            // No HTML tags, just the info as text for clipboard
            return (
`Happy Birthday, ${name}!

Hey ${name}, happy ${age}th birthday!

As someone who loves ${hobby}, you deserve the most ${adjective} year ever!
May your days be filled with endless ${pluralNoun}, laughter, and cake.

Remember: you're only as ${adjective} as the number of ${pluralNoun} you collect!`
            );
        }
        
        document.getElementById('cardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value.trim();
            const hobby = document.getElementById('hobby').value.trim();
            const adjective = document.getElementById('adjective').value.trim();
            const pluralNoun = document.getElementById('pluralNoun').value.trim();

            // Create the card DOM
            const card = document.createElement('div');
            card.className = 'birthday-card';
            // Give a unique card id for copy functionality
            const cardId = `card${Math.floor(Math.random() * 1e12)}`;
            card.setAttribute('data-cardid', cardId);
            
            card.innerHTML = `
                <div class="balloons">🎈🎊🎁</div>
                <div class="card-title">Happy Birthday, ${name}!</div>
                <div class="inside-message">
                    ${funnyMessage(name, age, hobby, adjective, pluralNoun)}
                </div>
                <button class="copy-btn" data-copyid="${cardId}" type="button">Copy Card</button>
            `;

            // Add to card section (on top of existing cards)
            const section = document.getElementById('cardSection');
            section.insertBefore(card, section.firstChild);

            // Add event listener to this specific "Copy" button
            card.querySelector('.copy-btn').addEventListener('click', function() {
                const button = this;
                // Copy the plain message
                const text = plainTextCard(name, age, hobby, adjective, pluralNoun);
                // Clipboard API
                navigator.clipboard.writeText(text).then(() => {
                    // Visual feedback
                    button.textContent = "Copied!";
                    button.classList.add('copied');
                    setTimeout(() => {
                        button.textContent = "Copy Card";
                        button.classList.remove('copied');
                    }, 1200);
                });
            });

            // Clear form
            this.reset();
        });

        // "I'm feeling lucky" button logic
        document.getElementById('luckyBtn').addEventListener('click', function() {
            document.getElementById('name').value = getRandom(names);
            document.getElementById('age').value = getRandom(ages);
            document.getElementById('hobby').value = getRandom(hobbies);
            document.getElementById('adjective').value = getRandom(adjectives);
            document.getElementById('pluralNoun').value = getRandom(pluralNouns);
        });
    </script>
</body>
</html>
